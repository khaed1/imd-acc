name: Refresh the data snapshot

# The Pages workflow's own schedule never fired (docs/data-api.md says about every 15 minutes).
# This one only starts that workflow, which rebuilds data/v1 and redeploys the site.
on:
  schedule:
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start the Pages workflow
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
